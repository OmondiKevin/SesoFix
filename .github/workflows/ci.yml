name: Data preparation CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install local preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile active Python modules
        run: python -m compileall -q src scripts tests
      - name: Run engineering tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Confirm local training remains disabled
        run: |
          if make train; then
            echo "Local training guard unexpectedly succeeded"
            exit 1
          fi
